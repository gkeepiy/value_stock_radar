name: Value Stock Radar

on:
  workflow_dispatch:

  schedule:
    # 월~금 23:30 UTC
    - cron: "30 23 * * 1-5"

permissions:
  contents: write


jobs:
  update-radar:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Choose radar mode
        shell: bash
        run: |
          DAY=$(date -u +%u)

          if [ "$DAY" = "1" ]; then
            echo "RADAR_MODE=weekly" >> "$GITHUB_ENV"
          else
            echo "RADAR_MODE=daily" >> "$GITHUB_ENV"
          fi

      - name: Run radar
        run: |
          python run_radar.py

      - name: Save updated radar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update stock radar data"
            git push
          fi